name = "he-yuan-personal-homepage"
compatibility_date = "2024-09-23"
main = "worker/index.mjs"

[assets]
directory = "./public"
binding = "ASSETS"

# KV namespace for the like counter. Create it once with:
#   npx wrangler kv namespace create LIKES
# then paste the returned id below.
[[kv_namespaces]]
binding = "LIKES"
id = "REPLACE_ME_AFTER_KV_CREATE"

# Secrets are set with:
#   npx wrangler secret put LLM_API_KEY
# Optional overrides (use [vars] for non-secret defaults):
#   npx wrangler secret put LLM_API_URL
#   npx wrangler secret put LLM_MODEL
